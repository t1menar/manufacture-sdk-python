# Ideas -> video -> human review (loops back on reject) -> publish.
apiVersion: manufacture.dev/v1
kind: Pipeline
metadata:
  name: video
  labels: {project: reels}
spec:
  trigger: {source: ideas}
  concurrency: {max_runs: 2, min_interval: 30m, count_waiting: false}
  priority: 10
  budget: {run_usd: 5, warn_usd: 4, day_usd: 30}
  blobs: {ttl: 30d}
  defaults:
    timeout: 30m
    lease: 2m
    on_timeout: retry
    retry: {max_attempts: 3, backoff: exponential, initial: 5s, max: 10m, on_errors: [transient, timeout, lost]}
  stages:
    - name: video
      step:
        module: video-claude
        timeout: 90m
        input:
          idea: data.idea
          feedback: "has(data.review) ? data.review.reason : ''"
    - name: review
      step: {module: review-telegram, timeout: 10m, wait: {timeout: 7d}, on_timeout: attention, on_cancel: attention, min_budget_usd: 0}
      routes:
        - when: "steps.review.output.decision == 'rejected'"
          goto: video
          max_visits: 3
    - name: publish
      step: {module: publish-instagram, timeout: 30m}
---
apiVersion: manufacture.dev/v1
kind: Module
metadata: {name: ideas}
spec:
  image: ghcr.io/t1menar/mf-ideas:1.2.0
  replicas: 1
  subscribe: [run.started, {event: run.finished, pipelines: [video]}]
---
apiVersion: manufacture.dev/v1
kind: Module
metadata: {name: video-claude}
spec:
  image: ghcr.io/t1menar/mf-video@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  replicas: {min: 0, max: 2, metric: queue_depth, target: 1}
  concurrency: 1
  resources: {cpu: "2", memory: 4Gi}
  secrets:
    - {env: CLAUDE_OAUTH_TOKEN, secretRef: {name: video-keys, key: claude}}
---
apiVersion: manufacture.dev/v1
kind: Module
metadata: {name: review-telegram}
spec:
  image: ghcr.io/t1menar/mf-review:0.4.1
  env: {TELEGRAM_MODE: real}
  config: {admin_chat: 42}
---
apiVersion: manufacture.dev/v1
kind: Module
metadata: {name: publish-instagram}
spec:
  runtime: external
  concurrency: 2
  min_budget_usd: 1.5

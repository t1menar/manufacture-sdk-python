name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest

  integration:
    # Runtime against a real RabbitMQ; the tests play the core (exchanges, commands, events).
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: pytest -m integration
        env:
          MF_TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
        run: uv run pytest tests/integration -m integration -v

  contract-drift:
    # Byte-compares the vendored contract with the pinned manufacture-core commit on GitHub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: drift test (pinned contract release)
        env:
          MF_CONTRACT_ONLINE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run pytest tests/contract -m contract_online -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv build
      - name: wheel ships the contract and py.typed
        run: |
          unzip -l dist/*.whl | tee /tmp/wheel.txt
          grep -q 'manufacture/py.typed' /tmp/wheel.txt
          grep -q 'manufacture/_contract/schemas/v1/module.schema.json' /tmp/wheel.txt
          grep -q 'manufacture/_contract/schemas/envelope/v2/envelope.schema.json' /tmp/wheel.txt
          grep -q 'manufacture/_contract/contract.lock.json' /tmp/wheel.txt
      - name: wheel installs and the CLI runs
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/mf-module --help
